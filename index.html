<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมหารค่าอาหาร</title>
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #b59021;
            --danger: #ff5f56;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #2a374a;
            --success: #22c55e;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text);
            background-color: var(--bg);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
        }

        /* Toolbar สำหรับ Save/Load */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .btn-tool {
            padding: 6px 12px;
            font-size: 12px;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-tool:hover { background: var(--border); }

        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .section { margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }

        input[type="text"], input[type="number"] {
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            border-radius: 6px;
            width: 100%;
        }

        button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-gold { background: var(--primary); color: var(--bg); }
        .btn-gold:hover { background: var(--primary-hover); }
        .btn-del { background: var(--danger); color: white; padding: 4px 8px; font-size: 11px; }

        /* Friend Tags */
        .friend-list-area {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed var(--border);
        }
        .friend-tag {
            background: var(--input-bg); color: var(--primary);
            padding: 4px 10px; border-radius: 15px; border: 1px solid var(--primary);
            display: flex; align-items: center; gap: 8px; font-size: 0.9em;
        }
        .del-tag { cursor: pointer; color: var(--text-muted); }
        .del-tag:hover { color: var(--danger); }

        /* Checkboxes */
        .friend-checkboxes {
            display: flex; flex-wrap: wrap; gap: 8px; padding: 12px;
            background: rgba(0,0,0,0.2); border-radius: 8px;
        }
        .cb-item {
            display: flex; align-items: center; gap: 5px;
            background: var(--input-bg); padding: 5px 10px; border-radius: 5px;
            font-size: 0.9em; border: 1px solid var(--border);
        }

        /* List Items */
        ul { list-style: none; padding: 0; }
        li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02); margin-bottom: 4px; border-radius: 4px;
        }
        .details { font-size: 0.8em; color: var(--text-muted); }

        /* Summary */
        .summary-box {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), transparent);
            padding: 15px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .total-row { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); font-size: 1.2em; }
        .person-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <button class="btn-tool" onclick="saveToFile()">💾 บันทึกไฟล์ (Save)</button>
        <button class="btn-tool" onclick="document.getElementById('fileInput').click()">📂 เปิดไฟล์ (Open)</button>
        <input type="file" id="fileInput" style="display:none" accept=".json" onchange="openFile(event)">
    </div>

    <h1>🥘 หารค่าอาหาร</h1>

    <div class="section">
        <h3>1. รายชื่อเพื่อน</h3>
        <div class="input-group">
            <input type="text" id="friendName" placeholder="เพิ่มชื่อเพื่อน..." onkeypress="if(event.key==='Enter')addFriend()">
            <button class="btn-gold" onclick="addFriend()">เพิ่ม</button>
        </div>
        <div id="friendListDisplay" class="friend-list-area"></div>
    </div>

    <div class="section">
        <h3>2. รายการอาหาร</h3>
        <div class="input-group">
            <input type="text" id="foodName" placeholder="ชื่อเมนู" style="flex:2">
            <input type="number" id="foodPrice" placeholder="ราคา" style="flex:1">
        </div>
        <p style="font-size:0.85em; color:var(--primary); margin:5px 0;">ใครหารบ้าง?</p>
        <div id="friendCheckboxes" class="friend-checkboxes"></div>
        <button class="btn-gold" style="width:100%; margin-top:10px" onclick="addFoodItem()">+ บันทึกรายการนี้</button>
    </div>

    <div class="section">
        <h3>📝 รายการที่สั่งไป</h3>
        <ul id="foodList"></ul>
    </div>

    <div class="summary-box">
        <div class="total-row"><span>รวมทั้งหมด:</span><span id="grandTotal">0.00 ฿</span></div>
        <hr style="opacity:0.2">
        <div id="resultList"></div>
    </div>
</div>

<script>
    let friends = [];
    let foodItems = [];

    // --- ระบบจัดการไฟล์ ---
    function saveToFile() {
        if (friends.length === 0 && foodItems.length === 0) {
            alert("ไม่มีข้อมูลให้บันทึก"); return;
        }
        const data = { friends, foodItems };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bill-${new Date().toLocaleDateString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function openFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                friends = data.friends || [];
                foodItems = data.foodItems || [];
                updateUI();
                alert("โหลดข้อมูลเรียบร้อยแล้ว");
            } catch (err) {
                alert("ไฟล์ไม่ถูกต้อง");
            }
        };
        reader.readAsText(file);
    }

    // --- ระบบจัดการข้อมูลหน้าเว็บ ---
    function addFriend() {
        const input = document.getElementById('friendName');
        const name = input.value.trim();
        if (name && !friends.includes(name)) {
            friends.push(name);
            input.value = '';
            updateUI();
        }
    }

    function removeFriend(name) {
        if(confirm(`ต้องการลบ ${name}?`)) {
            friends = friends.filter(f => f !== name);
            foodItems.forEach(item => item.sharers = item.sharers.filter(s => s !== name));
            updateUI();
        }
    }

    function addFoodItem() {
        const name = document.getElementById('foodName').value.trim();
        const price = parseFloat(document.getElementById('foodPrice').value);
        const checked = Array.from(document.querySelectorAll('.friend-check:checked')).map(cb => cb.value);

        if (!name || isNaN(price) || checked.length === 0) {
            alert("กรุณากรอกข้อมูลให้ครบและเลือกคนหารอย่างน้อย 1 คน"); return;
        }

        foodItems.push({ id: Date.now(), name, price, sharers: checked });
        document.getElementById('foodName').value = '';
        document.getElementById('foodPrice').value = '';
        updateUI();
    }

    function deleteFood(index) {
        foodItems.splice(index, 1);
        updateUI();
    }

    function updateUI() {
        // รายชื่อเพื่อน
        const friendDiv = document.getElementById('friendListDisplay');
        friendDiv.innerHTML = friends.map(f => `
            <div class="friend-tag">${f} <span class="del-tag" onclick="removeFriend('${f}')">✕</span></div>
        `).join('') || '<span style="color:var(--text-muted); font-size:0.8em; margin:auto;">ยังไม่มีชื่อเพื่อน</span>';

        // Checkboxes
        const cbDiv = document.getElementById('friendCheckboxes');
        cbDiv.innerHTML = friends.length ? friends.map(f => `
            <label class="cb-item"><input type="checkbox" class="friend-check" value="${f}" checked> ${f}</label>
        `).join('') : '<span style="font-size:0.8em; color:var(--text-muted);">เพิ่มเพื่อนก่อน...</span>';

        // รายการอาหาร
        const list = document.getElementById('foodList');
        list.innerHTML = foodItems.map((item, idx) => `
            <li>
                <div>
                    <strong>${item.name}</strong> <span style="color:var(--primary)">(${item.price.toLocaleString()} ฿)</span>
                    <div class="details">หาร ${item.sharers.length} คน: ${item.sharers.join(', ')}</div>
                </div>
                <button class="btn-del" onclick="deleteFood(${idx})">ลบ</button>
            </li>
        `).join('') || '<li style="justify-content:center; color:var(--text-muted); background:none; border:none;">ไม่มีรายการ</li>';

        // คำนวณเงิน
        let total = 0;
        let summary = {};
        friends.forEach(f => summary[f] = 0);

        foodItems.forEach(item => {
            total += item.price;
            if(item.sharers.length > 0) {
                const perHead = item.price / item.sharers.length;
                item.sharers.forEach(s => { if(summary[s]!==undefined) summary[s]+=perHead; });
            }
        });

        document.getElementById('grandTotal').innerText = total.toLocaleString(undefined, {minimumFractionDigits:2}) + ' ฿';
        
        document.getElementById('resultList').innerHTML = friends.map(f => `
            <div class="person-row"><span>${f}</span><span style="color:var(--primary); font-weight:bold;">${summary[f].toLocaleString(undefined, {minimumFractionDigits:2})} ฿</span></div>
        `).join('') || '<p style="text-align:center; color:var(--text-muted);">รอการคำนวณ...</p>';
    }

    updateUI();
</script>

</body>
</html>
