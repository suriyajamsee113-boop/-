<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมหารค่าอาหาร (Thai Dark Theme)</title>
    <style>
        :root {
            /* สีหลัก */
            --primary: #d4af37; /* สีทอง (Gold) แบบไทย */
            --primary-hover: #b59021;
            --danger: #ff5f56;  /* สีแดง */
            --bg: #0f172a;      /* สีกรมท่าเข้ม (Dark Navy) */
            --card: #1e293b;    /* สีกรมท่าสำหรับกล่องข้อความ */
            --text: #e2e8f0;    /* สีขาวอมเทา */
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #2a374a;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text);
            background-color: var(--bg);
            /* ลวดลายไทย (ลายประจำยามประยุกต์) สร้างด้วย CSS SVG */
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            /* เพิ่มขอบทองด้านบนให้ดูหรู */
            border-top: 4px solid var(--primary);
        }

        h1, h2, h3, h4 { 
            color: var(--primary); /* หัวข้อสีทอง */
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 30px; }
        h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        /* Form Elements */
        .section { margin-bottom: 30px; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            padding: 12px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text);
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-gold { background-color: var(--primary); color: #0f172a; }
        .btn-gold:hover { background-color: var(--primary-hover); }
        .btn-del { background-color: var(--danger); color: white; padding: 5px 12px; font-size: 12px;}

        /* Friend Tags (ส่วนที่เพิ่มปุ่มลบ) */
        .friend-list-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 40px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px dashed var(--border);
        }
        .friend-tag {
            background: var(--input-bg);
            color: var(--primary);
            padding: 5px 10px 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }
        .delete-friend-btn {
            background: rgba(255,255,255,0.1);
            color: var(--text-muted);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .delete-friend-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Checkboxes */
        .friend-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            color: var(--text);
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-item:hover { border-color: var(--primary); }
        input[type="checkbox"] { accent-color: var(--primary); transform: scale(1.2); }

        /* Food List */
        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        .item-details { font-size: 0.85em; color: var(--text-muted); margin-top: 4px; }

        /* Summary */
        .summary-box {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), transparent);
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .person-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            color: var(--text);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🥘 หารค่าบิล </h1>

    <div class="section">
        <h3>1. รายชื่อเพื่อน (เพิ่ม/ลบ)</h3>
        <div class="input-group">
            <input type="text" id="friendName" placeholder="พิมพ์ชื่อเพื่อน..." onkeypress="handleEnter(event, addFriend)">
            <button class="btn-gold" onclick="addFriend()">เพิ่มเพื่อน</button>
        </div>
        
        <div id="friendListDisplay" class="friend-list-area">
            <span style="color: var(--text-muted); font-size: 0.9em; margin: auto;">ยังไม่มีรายชื่อเพื่อน</span>
        </div>
    </div>

    <div class="section">
        <h3>2. สั่งรายการอาหาร</h3>
        <div class="input-group">
            <input type="text" id="foodName" placeholder="ชื่อเมนูอาหาร" style="flex: 2;">
            <input type="number" id="foodPrice" placeholder="ราคา (บาท)" style="flex: 1;">
        </div>
        
        <p style="margin: 10px 0 5px 0; color: var(--primary); font-size: 0.95em;">เลือกคนหารรายการนี้:</p>
        <div class="friend-checkboxes" id="friendCheckboxes">
            <span style="color: var(--text-muted); font-size: 0.9em;">กรุณาเพิ่มเพื่อนในข้อ 1 ก่อน...</span>
        </div>

        <button class="btn-gold" style="width: 100%; margin-top: 15px; padding: 12px;" onclick="addFoodItem()">+ บันทึกรายการ</button>
    </div>

    <div class="section">
        <h3>📝 รายการที่บันทึกแล้ว</h3>
        <ul id="foodList">
            <li style="justify-content: center; color: var(--text-muted); background:none; border:none;">ยังไม่มีรายการ</li>
        </ul>
    </div>

    <div class="summary-box">
        <div class="total-row">
            <span>ยอดรวมสุทธิ:</span>
            <span id="grandTotal">0.00 ฿</span>
        </div>
        <div style="height: 1px; background: var(--primary); opacity: 0.3; margin-bottom: 15px;"></div>
        <h4 style="margin: 0 0 10px 0; color: var(--text);">สรุปยอดรายคน:</h4>
        <div id="resultList">
            <p style="text-align: center; color: var(--text-muted);">...รอการคำนวณ...</p>
        </div>
    </div>
</div>

<script>
    let friends = [];
    let foodItems = [];

    function handleEnter(e, func) {
        if (e.key === 'Enter') func();
    }

    // --- 1. จัดการรายชื่อเพื่อน ---
    function addFriend() {
        const nameInput = document.getElementById('friendName');
        const name = nameInput.value.trim();

        if (name && !friends.includes(name)) {
            friends.push(name);
            nameInput.value = '';
            updateUI();
        } else if (friends.includes(name)) {
            alert('มีชื่อนี้อยู่แล้วครับ');
        }
    }

    function removeFriend(name) {
        if(confirm('ต้องการลบชื่อ "' + name + '" ออกใช่ไหม? (หากเขามีส่วนหารในรายการอาหาร ยอดจะถูกคำนวณใหม่โดยตัดเขาออก)')) {
            // ลบชื่อออกจาก list หลัก
            friends = friends.filter(f => f !== name);
            
            // ลบชื่อออกจากรายการอาหารที่เคยสั่งไปแล้วด้วย
            foodItems.forEach(item => {
                item.sharers = item.sharers.filter(s => s !== name);
            });

            updateUI();
        }
    }

    // ฟังก์ชันอัปเดตหน้าจอทั้งหมด
    function updateUI() {
        renderFriends();
        renderCheckboxes();
        renderFoodList(); // รีเฟรชรายการอาหารด้วยเผื่อจำนวนคนหารเปลี่ยน
        calculateShare();
    }

    function renderFriends() {
        const div = document.getElementById('friendListDisplay');
        if (friends.length === 0) {
            div.innerHTML = '<span style="color: var(--text-muted); font-size: 0.9em; margin: auto;">ยังไม่มีรายชื่อเพื่อน</span>';
            return;
        }

        div.innerHTML = friends.map(f => `
            <div class="friend-tag">
                ${f}
                <div class="delete-friend-btn" onclick="removeFriend('${f}')" title="ลบชื่อ">✕</div>
            </div>
        `).join('');
    }

    function renderCheckboxes() {
        const div = document.getElementById('friendCheckboxes');
        if (friends.length === 0) {
            div.innerHTML = '<span style="color: var(--text-muted); font-size: 0.9em;">กรุณาเพิ่มเพื่อนในข้อ 1 ก่อน...</span>';
            return;
        }

        // สร้าง checkbox เลือกทุกคน
        let html = `
            <div class="checkbox-item" onclick="toggleAll(this)">
                <input type="checkbox" id="selectAll" checked onchange="toggleAllCheckboxes(this)"> 
                <label style="cursor:pointer;">เหมาหมด (ทุกคน)</label>
            </div>
        `;
        
        // สร้าง checkbox ตามรายชื่อเพื่อน
        html += friends.map(f => `
            <label class="checkbox-item">
                <input type="checkbox" value="${f}" checked class="friend-check"> ${f}
            </label>
        `).join('');

        div.innerHTML = html;
    }

    function toggleAll(divElement) {
         const checkbox = divElement.querySelector('input[type="checkbox"]');
         if(event.target !== checkbox) {
             checkbox.checked = !checkbox.checked;
             toggleAllCheckboxes(checkbox);
         }
    }

    function toggleAllCheckboxes(source) {
        const checkboxes = document.querySelectorAll('.friend-check');
        checkboxes.forEach(cb => cb.checked = source.checked);
    }

    // --- 2. จัดการรายการอาหาร ---
    function addFoodItem() {
        const foodName = document.getElementById('foodName').value.trim();
        const foodPrice = parseFloat(document.getElementById('foodPrice').value);
        
        const checkboxes = document.querySelectorAll('.friend-check:checked');
        const selectedFriends = Array.from(checkboxes).map(cb => cb.value);

        if (!foodName || isNaN(foodPrice)) {
            alert('กรุณากรอกชื่อเมนูและราคาให้ถูกต้อง'); return;
        }
        if (selectedFriends.length === 0) {
            alert('ต้องมีคนหารอย่างน้อย 1 คนครับ'); return;
        }

        const item = {
            id: Date.now(),
            name: foodName,
            price: foodPrice,
            sharers: selectedFriends
        };

        foodItems.push(item);
        
        // Reset inputs
        document.getElementById('foodName').value = '';
        document.getElementById('foodPrice').value = '';
        // Reset selection
        renderCheckboxes();

        renderFoodList();
        calculateShare();
    }

    function deleteItem(index) {
        foodItems.splice(index, 1);
        renderFoodList();
        calculateShare();
    }

    function renderFoodList() {
        const list = document.getElementById('foodList');
        if (foodItems.length === 0) {
            list.innerHTML = '<li style="justify-content: center; color: var(--text-muted); background:none; border:none;">ยังไม่มีรายการ</li>';
            return;
        }

        list.innerHTML = foodItems.map((item, index) => `
            <li>
                <div>
                    <strong style="color: var(--text); font-size:1.1em;">${item.name}</strong> 
                    <span style="color: var(--primary);">(${formatMoney(item.price)})</span>
                    <div class="item-details">
                        คนหาร (${item.sharers.length}): ${item.sharers.join(', ')}
                        ${item.sharers.length === 0 ? '<span style="color:var(--danger)">(ไม่มีคนหาร - กรุณาลบรายการนี้)</span>' : ''}
                    </div>
                </div>
                <button class="btn-del" onclick="deleteItem(${index})">ลบ</button>
            </li>
        `).join('');
    }

    // --- 3. คำนวณเงิน ---
    function calculateShare() {
        let grandTotal = 0;
        let friendTotals = {};

        friends.forEach(f => friendTotals[f] = 0);

        foodItems.forEach(item => {
            if(item.sharers.length > 0) {
                grandTotal += item.price;
                const pricePerPerson = item.price / item.sharers.length;
                item.sharers.forEach(person => {
                    if (friendTotals[person] !== undefined) {
                        friendTotals[person] += pricePerPerson;
                    }
                });
            }
        });

        document.getElementById('grandTotal').textContent = formatMoney(grandTotal);

        const resultDiv = document.getElementById('resultList');
        if (friends.length === 0) {
            resultDiv.innerHTML = '<p style="text-align: center; color: var(--text-muted);">เพิ่มเพื่อนเพื่อเริ่มคำนวณ</p>';
            return;
        }

        let html = '';
        let hasData = false;
        for (const [name, total] of Object.entries(friendTotals)) {
            hasData = true;
            html += `
                <div class="person-row">
                    <span>${name}</span>
                    <span style="font-weight: bold; color: var(--primary);">${formatMoney(total)}</span>
                </div>
            `;
        }
        
        if(!hasData) html = '<p style="text-align: center; color: var(--text-muted);">ยังไม่มีรายการ</p>';
        resultDiv.innerHTML = html;
    }

    function formatMoney(amount) {
        return amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ฿';
    }
</script>

</body>
</html>
